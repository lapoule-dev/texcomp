name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features gpu -- -D warnings

  # The `rust-version` in Cargo.toml, held: wgpu 30 needs 1.97.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo check --all-targets --features gpu
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features gpu -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Without a GPU adapter the GPU tests print why and skip; the kernels'
      # WGSL is still validated (`gpu::tests::every_kernel_validates`).
      - run: cargo test
      - run: cargo test --features gpu

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The CPU side: no dependency on wgpu, nothing but std.
      - run: cargo check --target wasm32-unknown-unknown
      # The GPU side as a browser build links it, on wgpu's WebGPU backend.
      - run: cargo check --target wasm32-unknown-unknown --features gpu

  wasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # The CPU side's tests, the bit-exact reference vectors and the KTX 2.0
      # container included, in wasm. The tests read their fixtures by
      # absolute path, so the workspace is mapped into the guest at the same
      # path.
      - run: cargo test --target wasm32-wasip1 --lib --test uastc_reference --test uastc_encode --test ktx2
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir ${{ github.workspace }}::${{ github.workspace }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --features gpu
        env:
          RUSTDOCFLAGS: -D warnings
